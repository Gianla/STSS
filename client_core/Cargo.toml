[package]
name = "client_core"
version = "0.1.0"
edition = "2024"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
thiserror = "2.0.18"
shared_library = { version = "0.1.0", path = "../shared_library" }
tokio = { version = "1.52.3", features = ["io-util"] }
tokio-util = { version = "0.7.18", features = ["codec", "rt", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
sha2 = { version = "0.11.0", features = ["oid"] }
webpki-roots = "1.0.7"
bytes = "1.11.1"
futures = "0.3.32"
rsa = "0.9.10"
hex = "0.4.3"
