[package]
name = "client_core"
version = "0.1.0"
edition = "2024"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
hex = "0.4.3"
thiserror = "2.0.18"
shared_library = { version = "0.1.0", path = "../shared_library" }
wincode = "0.5.4"
tokio = "1.52.3"
tokio-util = { version = "0.7.18", features = ["codec", "rt", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
sha2 = { version = "0.11.0", features = ["oid"] }
webpki-roots = "1.0.7"
bytes = "1.11.1"
futures = "0.3.32"
rsa = "0.10.0-rc.18"
