name: Test CI (Cross-Platform)

on:
  workflow_run:
    workflows: ["Build CI (Cross-Platform)"] # Deve coincidere esattamente con il nome del workflow di build
    types:
      - completed

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    
    # CRITICO: Esegue questo job solo se il workflow di Build è terminato con successo
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
          - os: windows-latest
            target: i686-pc-windows-msvc

    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          # FONDAMENTALE per le Pull Request: assicura di testare il codice della PR, non del main
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install 32-bit multilib (Linux only)
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Rust toolchain Setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Exec Test
        run: cargo test --workspace --target ${{ matrix.target }} --verbose
